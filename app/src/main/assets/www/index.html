<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0e1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Codeum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <header>
    <button class="icon-btn back" id="backBtn" data-act="back" data-ta="nav.back" data-i="back" hidden></button>
    <div class="logo" id="hLogo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l5 5-5 5"/><path d="M13 17h6"/></svg></div>
    <div class="htitle"><div class="trow"><b id="hTitle">Codeum</b>
      <span class="updbox" id="updBox" hidden><button class="upd" data-act="update" id="updBtn"></button><button class="upd-more" data-act="upd-notes" id="updMore" data-ta="upd.whatsNew"></button></span></div>
      <small id="hSub"></small></div>
    <button class="run" id="runBtn" data-act="run" hidden></button>
    <button class="icon-btn" data-act="settings" data-ta="settings.title" data-i="gear"></button>
  </header>
  <div class="upd-panel" id="updPanel" hidden></div>
  <main id="main">
    <section class="view on" id="v-home"></section>
    <section class="view" id="v-projects"></section>
    <section class="view" id="v-editor">
      <div class="ed-bar">
        <button class="icon-btn" data-act="drawer" data-ta="ed.files" data-i="sidebar"></button>
        <div class="tabs" id="tabs"></div>
        <button class="icon-btn ai" data-act="ai" data-ta="ai.title" data-i="spark"></button>
        <button class="icon-btn" data-act="undo" data-ta="ed.undo" data-i="undo"></button>
        <button class="icon-btn" data-act="find" data-ta="ed.find" data-i="search"></button>
      </div>
      <div class="findbar" id="findbar" hidden>
        <div class="fline"><input id="fq" data-tp="ed.findPh" autocapitalize="off"><button class="icon-btn" data-act="find-next" data-i="down"></button><button class="icon-btn" data-act="find" data-i="x"></button></div>
        <div class="fline"><input id="frp" data-tp="ed.replacePh" autocapitalize="off"><button class="btn sec" data-act="rep-one" data-t="ed.replace"></button><button class="btn sec" data-act="rep-all" data-t="ed.replaceAll"></button></div>
      </div>
      <div class="editor" id="editor"><div class="gutter"><div id="gl">1</div></div>
        <div class="code"><pre id="hl"></pre><textarea id="ta" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea></div>
        <div class="ed-empty" id="edEmpty" hidden></div>
      </div>
      <div class="status"><span id="stSave"></span><span id="stLang"></span><span id="stPos">Ln 1, Col 1</span><span id="stTab"></span><span>UTF-8</span></div>
      <div class="acbar" id="acBar"></div>
      <div class="keys" id="keys"></div>
      <div class="drawer-bg" data-act="drawer"></div>
      <div class="drawer" id="drawer"></div>
    </section>
    <section class="view" id="v-term">
      <div class="term-wrap">
        <div class="term-head" id="termHead"></div>
        <div class="xterm-box" id="xterm" hidden></div>
        <div class="term" id="term"></div>
        <div class="term-in" id="termIn"><span id="tprompt">$</span><input id="tin" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" enterkeyhint="send"></div>
      </div>
      <div class="keys" id="tkeys"></div>
    </section>
    <section class="view" id="v-store"></section>
  </main>
  <nav id="nav"></nav>
</div>
<div class="webv" id="webv" hidden>
  <div class="webv-bar"><span class="dot"></span><b id="webvT"></b>
    <button class="icon-btn" data-act="web-reload" data-ta="web.reload" data-i="refresh"></button>
    <button class="icon-btn" data-act="web-close" data-ta="common.close" data-i="x"></button></div>
  <iframe id="webvF" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
  <div class="webv-log" id="webvLog" hidden></div>
</div>
<div class="splash" id="splash">
  <div class="logo sp-logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l5 5-5 5"/><path d="M13 17h6"/></svg></div>
  <div class="sp-name">Codeum</div>
  <div class="sp-bar"><i id="spFill"></i></div>
</div>
<div class="coach" id="coach" hidden></div>
<div class="sheet" id="sheet"><div class="sheet-bg" data-act="close-sheet"></div><div class="sheet-card" id="sheetCard"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div class="onb" id="onb" hidden></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" multiple hidden>
<input type="file" id="dirIn" webkitdirectory multiple hidden>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="i18n/en.js"></script>
<script src="i18n/ru.js"></script>
<script src="i18n/uk.js"></script>
<script src="i18n/de.js"></script>
<script src="i18n/fr.js"></script>
<script src="i18n/it.js"></script>
<script src="i18n/es.js"></script>
<script src="i18n/pt.js"></script>
<script src="i18n/pl.js"></script>
<script src="i18n/tr.js"></script>
<script src="app.js"></script>
</body>
</html>
