<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codeum — a development environment for Android</title>
<meta name="description" content="Editor, Linux terminal and 17 programming languages in one Android app.">
<meta property="og:title" content="Codeum — a development environment for Android">
<meta property="og:description" content="Editor, Linux terminal and 17 programming languages in one Android app.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://himsson.github.io/Codeum/">
<meta property="og:image" content="https://himsson.github.io/Codeum/social-preview.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
:root{--bg:#0e1117;--panel:#161b25;--card:#1d2330;--line:#283044;
  --text:#e7eaf3;--muted:#98a0b5;--accent:#5b8cff;--accent2:#3ddbc4}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--accent)}
.wrap{max-width:900px;margin:0 auto;padding:0 22px}

.hero{position:relative;text-align:center;padding:84px 0 64px;overflow:hidden}
.hero:before{content:"";position:absolute;inset:-40% 0 auto;height:600px;pointer-events:none;
  background:radial-gradient(60% 50% at 50% 40%,rgba(91,140,255,.24),transparent 70%)}
.logo{position:relative;width:104px;height:104px;margin:0 auto 26px;border-radius:32px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--accent),var(--accent2));box-shadow:0 22px 55px -18px rgba(91,140,255,.85)}
.logo svg{width:56px;height:56px}
h1{position:relative;font-size:clamp(40px,8vw,64px);font-weight:800;letter-spacing:-.035em}
.tag{position:relative;max-width:620px;margin:16px auto 0;font-size:clamp(18px,3.6vw,23px);color:var(--muted)}
.btns{position:relative;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:36px}
.btn{display:inline-flex;align-items:center;gap:9px;height:56px;padding:0 30px;border-radius:16px;
  font-weight:700;font-size:17px;text-decoration:none;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.pri{color:#fff;background:linear-gradient(140deg,var(--accent),#4d7ef0);box-shadow:0 16px 36px -14px var(--accent)}
.btn.sec{color:var(--text);background:var(--card);border:1px solid var(--line)}

section{padding:46px 0}
h2{font-size:clamp(25px,4.6vw,32px);font-weight:700;letter-spacing:-.02em;margin-bottom:22px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.card b{display:block;font-size:18px;margin-bottom:7px}
.card span{color:var(--muted);font-size:16px}
.langs{display:flex;flex-wrap:wrap;gap:10px}
.lang{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 17px;font-size:15.5px}
.note{margin-top:22px;color:var(--muted);font-size:16px}
footer{border-top:1px solid var(--line);padding:26px 0 44px;color:var(--muted);font-size:15px;text-align:center}
footer a{color:var(--muted)}
.switch{position:absolute;top:22px;right:22px;display:flex;gap:6px;z-index:2}
.switch button{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:10px;
  padding:8px 13px;font:600 14px inherit;cursor:pointer}
.switch button.on{color:var(--text);border-color:var(--accent)}
</style>
</head>
<body>

<div class="switch">
  <button id="btn-en" class="on" onclick="setLang('en')">EN</button>
  <button id="btn-ru" onclick="setLang('ru')">RU</button>
</div>

<div class="hero">
  <div class="wrap">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l5 5-5 5"/><path d="M13 17h6"/></svg></div>
    <h1>Codeum</h1>
    <p class="tag" data-en="A development environment for Android: editor, Linux terminal and 17 programming languages."
       data-ru="Среда разработки для Android: редактор, терминал Linux и 17 языков программирования."></p>
    <div class="btns">
      <a class="btn pri" href="https://github.com/himsson/Codeum/releases/latest"><span>⬇️</span><span data-en="Download APK" data-ru="Скачать APK"></span></a>
      <a class="btn sec" href="https://github.com/himsson/Codeum"><span data-en="Source on GitHub" data-ru="Исходники на GitHub"></span></a>
    </div>
  </div>
</div>

<section>
  <div class="wrap">
    <h2 data-en="What's inside" data-ru="Что внутри"></h2>
    <div class="grid">
      <div class="card">
        <b data-en="Editor" data-ru="Редактор"></b>
        <span data-en="Highlighting, tabs, autocomplete, auto-closing brackets and a symbol bar for your language."
              data-ru="Подсветка, вкладки, автодополнение, парные скобки и панель символов под твой язык."></span></div>
      <div class="card">
        <b data-en="Linux terminal" data-ru="Терминал Linux"></b>
        <span data-en="vim, nano, git, pip and the rest — a real shell, not an imitation."
              data-ru="vim, nano, git, pip и всё остальное — настоящая оболочка, а не имитация."></span></div>
      <div class="card">
        <b data-en="Run" data-ru="Запуск"></b>
        <span data-en="One button runs the file; input and output go through the terminal."
              data-ru="Одна кнопка запускает файл, ввод и вывод идут через терминал."></span></div>
      <div class="card">
        <b data-en="Web preview" data-ru="Превью сайта"></b>
        <span data-en="HTML, CSS and JavaScript render in the app, with the console below the page."
              data-ru="HTML, CSS и JavaScript отрисовываются в приложении, под страницей — консоль."></span></div>
      <div class="card">
        <b data-en="SSH" data-ru="SSH"></b>
        <span data-en="Connect to a VPS by password or by a key generated in the app."
              data-ru="Подключение к VPS по паролю или по ключу, созданному в приложении."></span></div>
      <div class="card">
        <b data-en="File history" data-ru="История файла"></b>
        <span data-en="Versions are kept while you work — any of them comes back in one tap."
              data-ru="Версии сохраняются по ходу работы — любая возвращается одним нажатием."></span></div>
    </div>
  </div>
</section>

<section>
  <div class="wrap">
    <h2 data-en="Languages" data-ru="Языки"></h2>
    <div class="langs">
      <span class="lang">JavaScript</span><span class="lang">HTML &amp; CSS</span><span class="lang">Python</span>
      <span class="lang">TypeScript</span><span class="lang">C</span><span class="lang">C++</span>
      <span class="lang">C#</span><span class="lang">Java</span><span class="lang">Kotlin</span>
      <span class="lang">Go</span><span class="lang">Rust</span><span class="lang">PHP</span>
      <span class="lang">Ruby</span><span class="lang">Lua</span><span class="lang">Bash</span>
      <span class="lang">Swift</span><span class="lang">Dart</span>
    </div>
    <p class="note" data-en="Installed inside the app in one tap. Swift and Dart are coming."
       data-ru="Ставятся в приложении одной кнопкой. Swift и Dart — скоро."></p>
  </div>
</section>

<section>
  <div class="wrap">
    <h2 data-en="Install" data-ru="Установка"></h2>
    <p class="note" style="margin-top:0"
       data-en="Download the APK, open the file and allow installation from this source. Android 8.0 or newer."
       data-ru="Скачай APK, открой файл и разреши установку из этого источника. Android 8.0 или новее."></p>
    <p class="note"
       data-en="The app is not on Google Play: Play does not allow apps that download and run compilers, and Codeum needs exactly that. Termux is distributed the same way."
       data-ru="Приложения нет в Google Play: там запрещены приложения, которые скачивают и запускают компиляторы, а Codeum именно это и делает. Termux распространяется так же."></p>
  </div>
</section>

<footer>
  <div class="wrap">
    <p>© 2026 himsson · <a href="https://github.com/himsson/Codeum">GitHub</a> ·
      <a href="https://github.com/himsson/Codeum/releases">Releases</a> ·
      <a href="https://github.com/himsson/Codeum/issues">Issues</a></p>
  </div>
</footer>

<script>
function setLang(l){
  document.documentElement.lang = l;
  document.querySelectorAll('[data-en]').forEach(function(e){ e.textContent = e.getAttribute('data-' + l); });
  document.getElementById('btn-en').className = l === 'en' ? 'on' : '';
  document.getElementById('btn-ru').className = l === 'ru' ? 'on' : '';
  try { localStorage.setItem('codeum-site-lang', l); } catch (e) {}
}
var saved;
try { saved = localStorage.getItem('codeum-site-lang'); } catch (e) {}
setLang(saved || ((navigator.language || 'en').slice(0, 2) === 'ru' ? 'ru' : 'en'));
</script>
</body>
</html>
